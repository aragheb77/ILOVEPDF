name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/ILOVEPDF/ILOVEPDF.csproj
      - name: Build
        run: dotnet build src/ILOVEPDF/ILOVEPDF.csproj -c Release --no-restore
      - name: Publish smallest framework-dependent single-file EXE
        run: dotnet publish src/ILOVEPDF/ILOVEPDF.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/ILOVEPDF-win-x64
      - name: Add third-party notices
        shell: pwsh
        run: |
          @"
          ILOVEPDF Desktop third-party notices

          Office file conversions use LibreOffice when it is installed on the computer. LibreOffice is free and open source, distributed under its applicable MPL-2.0 and LGPLv3+ licenses. It is not bundled in this compact EXE; install it separately from https://www.libreoffice.org/download/download-libreoffice/ to enable Office conversions. No LibreOffice installation is required for the app's native PDF and image functions.
          Project dependencies include PDFsharp, PdfPig, ClosedXML, and DocumentFormat.OpenXml. See the project README and each upstream project for license terms.

          ILOVEPDF is an independent project and is not affiliated with iLovePDF.
          "@ | Set-Content "artifacts/ILOVEPDF-win-x64/THIRD-PARTY-NOTICES.txt" -Encoding utf8
      - name: Upload compact Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ILOVEPDF-Windows-x64-Compact
          path: |
            artifacts/ILOVEPDF-win-x64/ILOVEPDF.exe
            artifacts/ILOVEPDF-win-x64/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
